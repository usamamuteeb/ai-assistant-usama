# Personal AI Assistant — configuration
# Edit this file directly; it's loaded fresh on every run (no rebuild needed).

models:
  premium:
    provider: anthropic
    model: claude-sonnet-4-6
    max_tokens: 2048
  local:
    provider: ollama
    model: llama3.1
    host: http://localhost:11434
    max_tokens: 2048
  groq:
    provider: groq
    base_url: https://api.groq.com/openai/v1
  free_api:
    max_tokens: 2048
    chain:
      - provider: gemini
        model: gemini-3.5-flash-lite
      - provider: gemini
        model: gemini-2.5-flash-lite
      - provider: gemini
        model: gemini-3.1-flash-lite
      - provider: gemini
        model: gemini-3.6-flash
      - provider: groq
        model: openai/gpt-oss-120b
      - provider: groq
        model: openai/gpt-oss-20b
      - provider: groq
        model: qwen/qwen3.6-27b
      - provider: openrouter
        model: nex-agi/nex-n2.5-pro:free
      - provider: openrouter
        model: cohere/north-mini-code:free
      - provider: openrouter
        model: google/gemma-4-31b-it:free
      - provider: openrouter
        model: inclusionai/ling-3.0-flash-vl:free
      - provider: openrouter
        model: nex-agi/nex-n2.5-mini:free
      - provider: openrouter
        model: inclusionai/ling-3.0-flash-sante:free
      - provider: openrouter
        model: inclusionai/ling-3.0-flash-fin:free
      - provider: openrouter
        model: dots-studio/dots-3-note-preview:free
      - provider: openrouter
        model: liquid/lfm-2.5-2.6b:free
      - provider: openrouter
        model: thinkingmachines/inkling:free
      - provider: openrouter
        model: thinkingmachines/inkling-small:free
      - provider: openrouter
        model: poolside/laguna-s-2.1:free
      - provider: openrouter
        model: poolside/laguna-xs-2.1:free
      - provider: openrouter
        model: google/gemma-4-26b-a4b-it:free

routing:
  # Heuristic knobs used by ModelRouter.pick_tier() in src/model_router.py
  premium_keywords:
    - plan
    - analyze
    - refactor
    - "write code"
    - architecture
    - debug
    - research
    - summarize a document
  long_message_char_threshold: 400   # messages longer than this lean premium
  default_tier: free_api              # fallback when heuristic is unsure (no cost, no local server needed)
  allow_premium: false

tool_relevance_filter:
  enabled: true
  # The mandatory core list includes WhatsApp Web so the chatbot can describe
  # and use it even when relevance filtering is enabled.
  max_tools: 20
  min_tools: 6
  core_tools:
    - filesystem
    - search_memory
    - search_knowledge_base
    - generate_image
    - create_task
    - list_tasks
    - set_reminder
    - list_reminders
    - whatsapp_open
    - whatsapp_list_unread_chats
    - whatsapp_read_chat
    - whatsapp_get_last_message_status
    - whatsapp_send_message
    - remember_fact
    - recall_facts
    - log_episode
    - recall_episodes
    - recall_procedure
    # Keep the screen-reader capability available for explicit screen-reading
    # requests; local keyword ranking alone can hide it behind the tool cap.
    - read_screen_text

slow_tools:
  # Local Stable Diffusion on CPU can take several minutes. This exception is
  # deliberately limited to the image tool; every other tool retains the
  # normal watchdog and 45-second loop budget.
  generate_image:
    max_seconds: 480

memory:
  sqlite_path: data/sqlite.db
  chroma_path: data/chroma
  chroma_collection: assistant_memory
  max_history_messages: 12            # how many past turns to load; tune this if 12 feels too short

memory_retrieval:
  similarity_weight: 0.6
  recency_weight: 0.2
  importance_weight: 0.2
  half_life_days: 14
  procedural_memory:
    similarity_threshold: 0.85

filesystem_tool:
  workspace_root: workspace           # relative paths are resolved here
  # Absolute filesystem access is limited to these user folders plus workspace_root.
  # New files/folders are additive; replacing or deleting a file asks for approval.
  allowed_roots:
    - 'C:\Users\HP\Documents'
    - 'C:\Users\HP\Downloads'
    - 'C:\Users\HP\Pictures'
    - 'C:\Users\HP\Videos'
    - 'C:\Users\HP\Desktop'
    - 'C:\Users\HP\Music'

shell_tool:
  require_confirmation: true          # ask before executing shell commands from the CLI
  timeout_seconds: 120

browser:
  # Keep browser actions visible on the desktop. Set this to true only when you
  # explicitly want unattended, invisible browser automation.
  headless: false
  # Project-local persistent profile. This keeps the WhatsApp Web login after
  # the first QR scan without exposing the user's normal Chrome profile.
  profile_dir: data/browser_profile

image_generation:
  # Images are generated locally. No Gemini image model or cloud image credits
  # are used by this plugin.
  generate_image_min_free_ram_gb: 1.5
  local_comfyui:
    url: http://127.0.0.1:8188
    auto_install: true
    auto_start: true
    # The automated, project-local CPU installation lives here.
    install_dir: data/comfyui
    launch_script: run_cpu.bat
    # Keep CPU generation practical on this computer; raise these only if a
    # faster compatible GPU becomes available.
    checkpoint: v1-5-pruned-emaonly-fp16.safetensors
    width: 384
    height: 384
    steps: 15
    cfg: 7.0
    sampler_name: euler
    scheduler: normal
    negative_prompt: ""
    start_timeout_seconds: 120
    timeout_seconds: 600

windows_control:
  # Keep desktop-affecting actions behind the browser confirmation dialog even
  # when the global approval mode is set to auto.
  force_manual_confirmation: true

dev_tools:
  # The path-oriented developer tools can work anywhere beneath this root,
  # including Documents, Downloads, Pictures, and other folders outside this project.
  allowed_root: 'C:\'
  # Write/delete/code execution use the browser's real manual-confirmation path
  # even when the global UI approval mode is set to auto.
  force_manual_confirmation: true
  protected_path_prefixes:
    - 'C:\Windows'
    - 'C:\Program Files'
    - 'C:\Program Files (x86)'
    - 'C:\Users\HP\AppData'

file_automation:
  # File automation can access any absolute path on C:, including Desktop,
  # Downloads, Documents, Pictures, Videos, and Music. Protected prefixes
  # above are still refused before confirmation or dry-run handling.
  force_manual_confirmation: true
  backup_folder: file_backups       # relative to the configured workspace root

google_workspace:
  credentials_path: credentials.json   # downloaded from Google Cloud Console project root
  scopes:
    - gmail.readonly
    - gmail.send
    - gmail.modify
    - calendar

knowledge_base:
  folder: knowledge_base               # relative to workspace root
  chroma_collection: assistant_knowledge_base
  chunk_size: 1400
  chunk_overlap: 180

task_manager:
  # The scheduler checks durable one-time reminders at this interval.
  reminder_poll_seconds: 15

scheduled_tasks:
  - name: daily_briefing
    cron: "0 8 * * *"
    prompt: >
      Give me my daily briefing: list today's calendar events, summarize how
      many unread emails I have and flag any that look urgent, and report
      current CPU/memory/disk usage. Write the full briefing as a formatted
      markdown file to briefings/<today's date>.md in the workspace, then
      just reply with a short confirmation that it's done.
    tier: free_api
    enabled: true
